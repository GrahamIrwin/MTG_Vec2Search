name: Crawl decks

# Adds public Commander decks from Archidekt and Moxfield to the deck corpus, which lives on the
# "deck-corpus" release (too big for git), then redeploys the site with them (Trends needs fresh decks).
on:
  schedule:
    - cron: "0 2 * * *" # daily
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: write # to update the release
  actions: write # to start "Build and deploy"

concurrency:
  group: crawl

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - run: gh release download deck-corpus
      - run: python3 -c "import build_index; build_index.download_bulk_data()" # card names for commanders, printings for Moxfield
      # Half the time on each site. The upload step runs even after a failed crawl: a failed crawl
      # keeps what it fetched (each deck is saved as it arrives)
      - run: python3 build_decks.py crawl --hours 2.5 --no-upload
      - if: ${{ !cancelled() }}
        run: python3 build_decks.py crawl --site moxfield --hours 2.5 --no-upload
      - if: ${{ !cancelled() }}
        run: gh release upload deck-corpus decks.jsonl.gz crawl_state.json --clobber
      - if: ${{ !cancelled() }}
        run: gh workflow run deploy.yml
