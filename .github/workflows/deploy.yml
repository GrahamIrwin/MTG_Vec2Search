name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1" # weekly (Monday), picks up newly released cards
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: python3 test_build_index.py && python3 test_build_decks.py && node --test
      - run: python3 build_index.py
      # Similar decks, from the corpus that "Crawl decks" keeps on the deck-corpus release.
      # Without it the card search still deploys; only Find similar decks is missing.
      - run: gh release download deck-corpus --pattern decks.jsonl.gz && python3 build_decks.py build
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
