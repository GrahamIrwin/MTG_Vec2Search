name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1" # weekly (Monday), picks up newly released cards
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # numpy: build_prices.py works out every day's estimated prices with it
      - run: python3 -m pip install --break-system-packages numpy
      - run: python3 test_build_index.py && python3 test_build_decks.py && python3 test_build_prices.py && node --test
      - run: python3 build_index.py
      # Similar decks, from the corpus that "Crawl decks" keeps on the deck-corpus release, with the
      # tournament results it keeps there too. Without the corpus the card search still deploys;
      # only the deck pages are missing. Without the results, commander pages have none.
      - run: |
          gh release download deck-corpus --pattern decks.jsonl.gz
          gh release download deck-corpus --pattern results.jsonl.gz || echo "No tournament results yet"
          python3 build_decks.py build
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
      # Prices, from the history "Crawl decks" keeps on the price-history release. Without it the
      # Prices tab and card details' price charts are missing; everything else deploys
      - run: |
          gh release download price-history --pattern prices.jsonl.gz
          gh release download price-history --pattern goldfish.jsonl.gz || echo "No estimates between our days yet"
          python3 build_prices.py site
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
      # Pages lets browsers reuse a file for 10 minutes, so a new index.html could run an old
      # cached app.js (or a new app.js an old deck.js). Each deploy's scripts get their own URLs.
      - run: sed -i -E "s/\.js\"/.js?v=${GITHUB_SHA::8}\"/" site/index.html site/app.js
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
