<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MTG Vector Search</title>
  <style>
    @font-face {
      font-family: 'Beleren Bold';
      src: url('/static/fonts/Beleren2016-Bold.ttf') format('truetype');
    }
    body {
      font-family: 'Beleren Bold', Garamond, serif;
      background: linear-gradient(#f8f1e7, #e9d8c7);
      background-attachment: fixed;
      color: #4b2e2e;
      text-align: center;
      padding-top: 50px;
    }
    h1 {
      font-size: 48px;
      text-shadow: 2px 2px 4px #d2a679;
      margin-bottom: 30px;
    }
    form {
      margin-top: 20px;
    }
    input[type=text] {
      width: 60%;
      padding: 14px;
      font-size: 18px;
      border: 2px solid #bfa27a;
      border-radius: 12px;
      background-color: #fdf6e3;
      box-shadow: inset 0 0 10px #e0cda9;
      font-family: Garamond, serif;
    }
    input[type=submit] {
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 20px;
      background-color: #5a8f68;
      color: white;
      border: none;
      border-radius: 10px;
      box-shadow: 2px 2px 6px #4d4d4d;
      cursor: pointer;
      transition: background 0.3s;
    }
    input[type=submit]:hover {
      background-color: #467451;
    }
  </style>
</head>
<body>
  <h1>Magic: The Gathering Search</h1>
  <form method="POST" action="/">
    <input type="text" id="query" name="query" placeholder="Describe your desired card..." required>
    <br><br>
    <input type="submit" value="Search">
  </form>
</body>
</html>
