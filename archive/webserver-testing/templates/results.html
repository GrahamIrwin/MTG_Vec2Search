<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MTG Search Results</title>
  <style>
    @font-face {
      font-family: 'Beleren Bold';
      src: url('/static/fonts/Beleren2016-Bold.ttf') format('truetype');
    }
    body {
      font-family: 'Beleren Bold', Garamond, serif;
      background: linear-gradient(#f8f1e7, #e9d8c7);
      color: #4b2e2e;
      text-align: center;
      padding-top: 20px;
    }
    h1 {
      font-size: 36px;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px #d2a679;
    }
    .recognized-features {
      font-family: Garamond, serif;
      font-size: 18px;
      margin-bottom: 20px;
      color: #6a4d2e;
    }
    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }
    .card {
      width: 230px;
      margin: 15px;
      background: #fcf8f0;
      padding: 10px;
      border: 2px solid #bfa27a;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.3s, box-shadow 0.3s;
      cursor: pointer;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInMoveUp 0.8s ease forwards;
    }
    .card:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 14px rgba(0,0,0,0.5);
    }
    img {
      width: 100%;
      border-radius: 8px;
    }
    .progress-container {
      width: 100%;
      background-color: #e0d4b8;
      border-radius: 8px;
      margin-top: 6px;
      height: 18px;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(to right, #5a8f68, #8fbc8f);
      border-radius: 8px;
      width: 0;
      transition: width 0.5s ease;
    }
    /* Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 10;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-content {
      background: #f5ebe0;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-wrap: wrap;
      width: 90%;
      max-width: 800px;
      max-height: 85vh;
      overflow: hidden;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
      animation: fadeInMoveUp 0.5s ease forwards;
    }
    .modal-left {
      flex: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-y: auto;
      min-width: 60%;
      max-height: 75vh;
    }
    .modal-right {
      flex: 1;
      overflow-y: auto;
      max-height: 75vh;
      padding-left: 10px;
      text-align: center;
    }
    .foil-wrapper {
      position: relative;
      width: 100%;
      max-width: 300px;
      overflow: hidden;
    }
    .foil-wrapper img {
      width: 100%;
      height: auto;
      display: block;
    }
    .price-line {
      font-family: Garamond, serif;
      font-size: 20px;
      margin: 10px 0;
      color: #4a3824;
    }
    .foil-toggle {
      margin-top: 10px;
      font-family: Garamond, serif;
      font-size: 16px;
      background: #fcf8f0;
      padding: 8px;
      border-radius: 10px;
      display: inline-block;
      margin-bottom: 10px;
    }
    .version-button {
      width: 95%;
      margin-bottom: 8px;
      padding: 6px 10px;
      background-color: #5a8f68;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      white-space: normal;
    }
    .version-button:hover {
      background-color: #467451;
    }
    .close-button {
      position: absolute;
      top: 8px;
      right: 12px;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
    }
    @keyframes fadeInMoveUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    /* Foil shimmer */
    .foil-shimmer::after {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(120deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
      animation: shimmer 2s infinite linear;
      pointer-events: none;
      z-index: 2;
    }
    @keyframes shimmer {
      0% { transform: translate(-100%, -100%) rotate(25deg); }
      50% { transform: translate(100%, 100%) rotate(25deg); }
      100% { transform: translate(200%, 200%) rotate(25deg); }
    }
  </style>
</head>
<body>
    <h1>Results for: "{{ query }}"</h1>
  
    {% if error %}
      <p><strong>{{ error }}</strong></p>
    {% else %}
      {% if features %}
        <div class="recognized-features">
          Recognized features: {{ features|join(', ') }}
        </div>
      {% endif %}
  
      <script id="results-data" type="application/json">
      {{ results|tojson }}
      </script>
  
      <div id="gallery" class="gallery"></div>
  
      {% if results|length > 10 %}
        <button id="loadMore">Load More</button>
      {% endif %}
    {% endif %}
  
    <br><br>
    <a href="/">🔙 New Search</a>
  
    <!-- Modal -->
    <div id="modal" class="modal">
      <div class="modal-content">
        <span class="close-button" onclick="closeModal()">×</span>
  
        <div class="modal-left">
          <div class="foil-wrapper" id="foil-wrapper">
            <img id="modal-img" src="" alt="Card Image">
          </div>
          <h2 id="modal-name"></h2>
          <p class="price-line" id="price-cad"></p>
          <div class="foil-toggle" id="foil-toggle-container" style="display:none;">
            <input type="checkbox" id="foilToggle">
            <label for="foilToggle">Show Foil Price</label>
          </div>
        </div>
  
        <div class="modal-right" id="modal-versions">
          <!-- Versions go here -->
        </div>
  
      </div>
    </div>
  
  <script>
    const results = JSON.parse(document.getElementById('results-data').textContent);
    let displayed = 0;
    let exchangeRate = null;
    let currentCardData = null;
  
    const gallery = document.getElementById('gallery');
    const loadMoreBtn = document.getElementById('loadMore');
    const modal = document.getElementById('modal');
    const foilWrapper = document.getElementById('foil-wrapper');
    const modalImg = document.getElementById('modal-img');
    const modalName = document.getElementById('modal-name');
    const priceCAD = document.getElementById('price-cad');
    const foilToggleContainer = document.getElementById('foil-toggle-container');
    const foilToggle = document.getElementById('foilToggle');
    const modalVersions = document.getElementById('modal-versions');
  
    async function fetchExchangeRate() {
      if (exchangeRate !== null) return;
      try {
        const response = await fetch('https://api.exchangerate.host/latest?base=USD&symbols=CAD');
        if (response.ok) {
          const data = await response.json();
          exchangeRate = data.rates.CAD;
        }
      } catch (err) {
        console.error('Error fetching exchange rate:', err);
        exchangeRate = 1.3;
      }
    }
  
    async function fetchCardById(id) {
      try {
        const response = await fetch(`https://api.scryfall.com/cards/${id}`);
        if (response.ok) {
          return await response.json();
        }
      } catch (err) {
        console.error('Error fetching card by ID:', err);
      }
      return null;
    }
  
    async function fetchFullCardInfo(name) {
      const url = `https://api.scryfall.com/cards/named?exact=${encodeURIComponent(name)}`;
      try {
        const response = await fetch(url);
        if (response.ok) {
          return await response.json();
        }
      } catch (err) {
        console.error('Error fetching full card info:', err);
      }
      return null;
    }
  
    function openModal(cardData) {
      currentCardData = cardData;
      updateModal();
      modal.style.display = 'flex';
    }
  
    function updateModal() {
      modalImg.src = currentCardData.image_uris
        ? currentCardData.image_uris.normal
        : currentCardData.card_faces[0].image_uris.normal;
      modalName.textContent = currentCardData.name;
      updatePrices();
  
      const hasFoil = currentCardData.prices.usd_foil !== null;
      foilToggleContainer.style.display = hasFoil ? 'block' : 'none';
  
      if (currentCardData.prices.usd) {
        foilToggle.checked = false;
      } else if (currentCardData.prices.usd_foil) {
        foilToggle.checked = true;
      }
      
      // Update price and shimmer immediately
      updatePrices();
      if (foilToggle.checked) {
        foilWrapper.classList.add('foil-shimmer');
      } else {
        foilWrapper.classList.remove('foil-shimmer');
      }
      /*
      if (foilToggle.checked) {
        foilWrapper.classList.add('foil-shimmer');
      } else {
        foilWrapper.classList.remove('foil-shimmer');
      }
  */
      modalVersions.innerHTML = '';
  
      if (currentCardData.prints_search_uri) {
        const header = document.createElement('h3');
        header.textContent = 'All Printings:';
        header.style.fontFamily = 'Garamond, serif';
        header.style.fontSize = '20px';
        header.style.marginBottom = '10px';
        modalVersions.appendChild(header);
      }
  
      fetch(currentCardData.prints_search_uri)
        .then(res => res.json())
        .then(data => {
          data.data.forEach((printing) => {
            const btn = document.createElement('button');
            btn.className = 'version-button';
            btn.textContent = printing.set_name;
            btn.onclick = async () => {
              const newCard = await fetchCardById(printing.id);
              if (newCard) {
                currentCardData = newCard;
                updateModal();
              }
            };
            modalVersions.appendChild(btn);
          });
        });
    }
  
    function updatePrices() {
      const foil = foilToggle.checked;
      const price = foil ? currentCardData.prices.usd_foil : currentCardData.prices.usd;
  
      if (price && exchangeRate) {
        priceCAD.textContent = `$${(parseFloat(price) * exchangeRate).toFixed(2)} CAD`;
      } else {
        priceCAD.textContent = "Price unavailable";
      }
    }
  
    function closeModal() {
      modal.style.display = 'none';
    }
  
    foilToggle.addEventListener('change', () => {
      if (currentCardData) {
        updatePrices();
        if (foilToggle.checked) {
          foilWrapper.classList.add('foil-shimmer');
        } else {
          foilWrapper.classList.remove('foil-shimmer');
        }
      }
    });
  
    async function showNextBatch(batchSize = 10) {
      const nextResults = results.slice(displayed, displayed + batchSize);
  
      for (const card of nextResults) {
        const cardDiv = document.createElement('div');
        cardDiv.className = 'card';
  
        const img = document.createElement('img');
        img.src = await fetchCardImage(card.name);
        img.alt = card.name;
        cardDiv.appendChild(img);
  
        const name = document.createElement('p');
        name.className = 'card-name';
        name.innerHTML = card.name;
        cardDiv.appendChild(name);
  
        const info = document.createElement('p');
        info.className = 'similarity';
        info.innerHTML = `${Math.round(card.similarity * 100)}% Match`;
        cardDiv.appendChild(info);
  
        const progressContainer = document.createElement('div');
        progressContainer.className = 'progress-container';
        const progressBar = document.createElement('div');
        progressBar.className = 'progress-bar';
        progressBar.style.width = `${card.similarity * 100}%`;
        progressContainer.appendChild(progressBar);
        cardDiv.appendChild(progressContainer);
  
        cardDiv.onclick = async () => {
          const fullInfo = await fetchFullCardInfo(card.name);
          if (fullInfo) openModal(fullInfo);
        };
  
        gallery.appendChild(cardDiv);
      }
  
      displayed += batchSize;
      if (displayed >= results.length && loadMoreBtn) {
        loadMoreBtn.style.display = 'none';
      }
    }
  
    async function fetchCardImage(name) {
      const url = `https://api.scryfall.com/cards/named?exact=${encodeURIComponent(name)}`;
      try {
        const response = await fetch(url);
        if (response.ok) {
          const data = await response.json();
          if (data.image_uris) return data.image_uris.normal;
          if (data.card_faces) return data.card_faces[0].image_uris.normal;
        }
      } catch (err) {
        console.error('Error fetching card image:', err);
      }
      return null;
    }
  
    async function initialize() {
      await fetchExchangeRate();
      showNextBatch();
    }
  
    if (loadMoreBtn) {
      loadMoreBtn.addEventListener('click', () => {
        showNextBatch();
      });
    }
  
    initialize();
  </script>
  </body>
  </html>
