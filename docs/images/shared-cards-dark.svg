<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" font-family="Georgia, 'Times New Roman', serif">
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8c7860"/></marker></defs>
<rect width="100%" height="100%" rx="10" fill="#231b15"/>
<text x="450.0" y="32.0" font-size="15" fill="#ecdfc8" text-anchor="middle" font-weight="bold">Two Derevi, Empyrial Tactician decks that share these cards, and nothing else:</text>
<text x="230.0" y="66.0" font-size="14" fill="#bba586" text-anchor="middle" font-weight="bold">The 6 cards the most decks play</text>
<rect x="30.0" y="80.0" width="400.0" height="24.0" rx="5" fill="#2b2119" stroke="#4a3929" stroke-width="1.2"/>
<text x="40.0" y="97.0" font-size="13" fill="#ecdfc8" text-anchor="start" font-weight="normal">Sol Ring</text>
<text x="298.0" y="97.0" font-size="12" fill="#bba586" text-anchor="end" font-weight="normal">83% of decks</text>
<text x="420.0" y="97.0" font-size="12" fill="#8c7860" text-anchor="end" font-weight="normal">counts 0.03</text>
<rect x="30.0" y="110.0" width="400.0" height="24.0" rx="5" fill="#2b2119" stroke="#4a3929" stroke-width="1.2"/>
<text x="40.0" y="127.0" font-size="13" fill="#ecdfc8" text-anchor="start" font-weight="normal">Birds of Paradise</text>
<text x="298.0" y="127.0" font-size="12" fill="#bba586" text-anchor="end" font-weight="normal">67% of decks</text>
<text x="420.0" y="127.0" font-size="12" fill="#8c7860" text-anchor="end" font-weight="normal">counts 0.16</text>
