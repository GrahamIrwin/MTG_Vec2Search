<text x="40.0" y="157.0" font-size="13" fill="#ecdfc8" text-anchor="start" font-weight="normal">Swords to Plowshares</text>
<text x="298.0" y="157.0" font-size="12" fill="#bba586" text-anchor="end" font-weight="normal">65% of decks</text>
<text x="420.0" y="157.0" font-size="12" fill="#8c7860" text-anchor="end" font-weight="normal">counts 0.18</text>
<rect x="30.0" y="170.0" width="400.0" height="24.0" rx="5" fill="#2b2119" stroke="#4a3929" stroke-width="1.2"/>
<text x="40.0" y="187.0" font-size="13" fill="#ecdfc8" text-anchor="start" font-weight="normal">Bloom Tender</text>
<text x="298.0" y="187.0" font-size="12" fill="#bba586" text-anchor="end" font-weight="normal">55% of decks</text>
<text x="420.0" y="187.0" font-size="12" fill="#8c7860" text-anchor="end" font-weight="normal">counts 0.36</text>
<rect x="30.0" y="200.0" width="400.0" height="24.0" rx="5" fill="#2b2119" stroke="#4a3929" stroke-width="1.2"/>
<text x="40.0" y="217.0" font-size="13" fill="#ecdfc8" text-anchor="start" font-weight="normal">Arcane Signet</text>
<text x="298.0" y="217.0" font-size="12" fill="#bba586" text-anchor="end" font-weight="normal">53% of decks</text>
<text x="420.0" y="217.0" font-size="12" fill="#8c7860" text-anchor="end" font-weight="normal">counts 0.41</text>
<rect x="30.0" y="230.0" width="400.0" height="24.0" rx="5" fill="#2b2119" stroke="#4a3929" stroke-width="1.2"/>
<text x="40.0" y="247.0" font-size="13" fill="#ecdfc8" text-anchor="start" font-weight="normal">Noble Hierarch</text>
<text x="298.0" y="247.0" font-size="12" fill="#bba586" text-anchor="end" font-weight="normal">51% of decks</text>
<text x="420.0" y="247.0" font-size="12" fill="#8c7860" text-anchor="end" font-weight="normal">counts 0.45</text>
<text x="230.0" y="278.0" font-size="22" fill="#ecdfc8" text-anchor="middle" font-weight="bold">under 1% alike</text>
<text x="670.0" y="66.0" font-size="14" fill="#bba586" text-anchor="middle" font-weight="bold">3 cards few decks play</text>
<rect x="470.0" y="80.0" width="400.0" height="24.0" rx="5" fill="#2b2119" stroke="#4a3929" stroke-width="1.2"/>
<text x="480.0" y="97.0" font-size="13" fill="#ecdfc8" text-anchor="start" font-weight="normal">Commander&#x27;s Sphere</text>
<text x="738.0" y="97.0" font-size="12" fill="#bba586" text-anchor="end" font-weight="normal">3% of decks</text>
<text x="860.0" y="97.0" font-size="12" fill="#45a066" text-anchor="end" font-weight="normal">counts 12.00</text>
<rect x="470.0" y="110.0" width="400.0" height="24.0" rx="5" fill="#2b2119" stroke="#4a3929" stroke-width="1.2"/>
<text x="480.0" y="127.0" font-size="13" fill="#ecdfc8" text-anchor="start" font-weight="normal">Brainstorm</text>
<text x="738.0" y="127.0" font-size="12" fill="#bba586" text-anchor="end" font-weight="normal">6% of decks</text>
<text x="860.0" y="127.0" font-size="12" fill="#45a066" text-anchor="end" font-weight="normal">counts 7.97</text>
<rect x="470.0" y="140.0" width="400.0" height="24.0" rx="5" fill="#2b2119" stroke="#4a3929" stroke-width="1.2"/>
<text x="480.0" y="157.0" font-size="13" fill="#ecdfc8" text-anchor="start" font-weight="normal">Chromatic Lantern</text>
<text x="738.0" y="157.0" font-size="12" fill="#bba586" text-anchor="end" font-weight="normal">5% of decks</text>
<text x="860.0" y="157.0" font-size="12" fill="#45a066" text-anchor="end" font-weight="normal">counts 9.23</text>
<text x="670.0" y="278.0" font-size="22" fill="#ecdfc8" text-anchor="middle" font-weight="bold">4% alike</text>
<text x="450.0" y="318.0" font-size="12" fill="#bba586" text-anchor="middle" font-weight="normal">A shared card counts ln(3,132 decks ÷ decks that play it)². Two decks are as alike as their shared cards&#x27; total over their own</text>
<text x="450.0" y="336.0" font-size="12" fill="#bba586" text-anchor="middle" font-weight="normal">(cosine similarity, here with two typical Derevi decks): sharing Sol Ring says nothing about a deck; sharing a rare pick says a lot.</text>
</svg>
