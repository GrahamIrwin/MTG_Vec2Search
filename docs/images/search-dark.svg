<text x="450.0" y="362.0" font-size="12" fill="#bba586" text-anchor="middle" font-weight="normal">A term&#x27;s weight is (1 + ln(34,232 cards ÷ cards with it))², so rare terms count for more: Elf (694 cards) counts 3.5× green.</text>
<text x="450.0" y="382.0" font-size="12" fill="#bba586" text-anchor="middle" font-weight="normal">A card scores the share of the query&#x27;s weight it covers. Extra features the query didn&#x27;t ask for don&#x27;t count against it; ties go to the more popular card.</text>
